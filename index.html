<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="description" content="Personal strength, conditioning, mobility and recovery training log.">
<title>Lift Log — Training & Performance</title>
<style>
:root{color-scheme:dark;--bg:#101820;--panel:#192530;--panel2:#202f3b;--ink:#eef4f7;--mut:#a7b7c2;--line:#334653;--accent:#83e0bb;--blue:#9db8ff;--warn:#ffd27c;--bad:#ff9d9d;--radius:15px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;padding-bottom:84px}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:var(--blue)}main{max-width:1060px;margin:auto;padding:18px}h1{font-size:1.7rem;margin:4px 0 6px}h2{font-size:1.15rem;margin:0 0 10px}h3{font-size:1rem;margin:0 0 5px}p{margin:7px 0}.muted{color:var(--mut)}.small{font-size:.84rem}.tiny{font-size:.75rem}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:15px;margin:12px 0}.hero{background:linear-gradient(130deg,#1b3540,#1d293b);border-color:#42606c}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.metric{font-size:1.55rem;font-weight:780;line-height:1.25}.pill{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:3px 9px;font-size:.76rem;color:var(--mut)}.good{color:var(--accent)}.warn{color:var(--warn)}.bad{color:var(--bad)}.field{display:flex;flex-direction:column;gap:4px;margin:8px 0}.field label{font-size:.82rem;color:var(--mut)}input,select,textarea{width:100%;min-width:0;padding:10px;border-radius:8px;border:1px solid var(--line);background:#111d26;color:var(--ink)}textarea{resize:vertical}.btn{border:0;border-radius:9px;padding:10px 14px;background:var(--accent);color:#10231d;font-weight:750}.btn.secondary{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn.danger{background:#4b252a;color:#ffdede}.btn.small{padding:6px 10px;font-size:.8rem}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:flex-start;overflow-x:auto;background:#121d26;border-top:1px solid var(--line);padding:7px max(6px,env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left));z-index:10}.tabs button{flex:0 0 auto;min-width:85px;background:none;border:0;color:var(--mut);padding:9px 10px;font-weight:650}.tabs button.active{color:var(--accent)}.tabs button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.listitem{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}.listitem:first-child{border-top:0}.day{padding:12px 0;border-top:1px solid var(--line)}.day:first-child{border-top:0}.exercise{padding:13px 0;border-top:1px solid var(--line)}.exercise:first-child{border-top:0}.exercise p{font-size:.87rem;color:var(--mut)}.sethead,.setrow{display:grid;grid-template-columns:34px repeat(3,minmax(55px,1fr));gap:7px;align-items:center}.sethead{font-size:.76rem;color:var(--mut);margin:8px 0 4px}.setrow{margin:5px 0}.setrow span{text-align:center;color:var(--mut)}.setrow input{padding:8px 5px;text-align:center}.notice{border-left:3px solid var(--warn);padding:9px 11px;background:#2b2a22;border-radius:5px;color:#f4e5c1}.progressbar{height:9px;background:#111d26;border-radius:99px;overflow:hidden;margin:7px 0}.progressbar span{display:block;height:100%;background:var(--accent);border-radius:99px}.checkrow{display:flex;gap:9px;align-items:flex-start;margin:7px 0}.checkrow input{width:auto;margin-top:4px;accent-color:var(--accent)}.chart{display:flex;align-items:flex-end;gap:7px;height:150px;padding:12px 4px 24px;border-bottom:1px solid var(--line)}.barwrap{flex:1;min-width:0;height:100%;display:flex;align-items:flex-end;position:relative}.bar{width:100%;min-height:2px;background:#83e0bb;border-radius:5px 5px 0 0}.barlabel{position:absolute;bottom:-23px;left:0;right:0;text-align:center;font-size:.68rem;color:var(--mut)}.exercise-demo{display:flex;gap:10px;align-items:center;margin:8px 0;padding:8px;background:#111d26;border:1px solid var(--line);border-radius:10px}.exercise-demo img{width:78px;height:78px;object-fit:contain;border-radius:8px;background:#202f3b}.demo-copy{flex:1}.demo-copy span{display:block;color:var(--mut);font-size:.78rem}.library-tools{display:grid;grid-template-columns:1fr 170px;gap:8px;margin:12px 0}.library-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px}.library-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px;color:var(--ink);text-align:left;min-width:0}.library-card img{width:100%;aspect-ratio:1;object-fit:contain;background:#111d26;border-radius:8px}.library-card b,.library-card span{display:block}.library-card span{color:var(--mut);font-size:.75rem}#exerciseModal{display:none;position:fixed;inset:0;background:#000c;z-index:30;align-items:center;justify-content:center;padding:14px}#exerciseModal.open{display:flex}#exerciseModal .modal-card{width:min(700px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}#exerciseModal .poses{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}#exerciseModal .poses img{width:100%;aspect-ratio:1;object-fit:contain;background:#111d26;border-radius:8px}#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#eaf5ef;color:#15251d;padding:10px 15px;border-radius:9px;z-index:50;max-width:90vw;box-shadow:0 5px 24px #0006}.empty{padding:18px;text-align:center;color:var(--mut)}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tag{display:inline-block;background:#263943;border-radius:6px;padding:3px 7px;margin:2px;font-size:.75rem;color:var(--mut)}.mutedlink{color:var(--mut)}@media(max-width:600px){main{padding:12px}.library-tools{grid-template-columns:1fr}.two{grid-template-columns:1fr}.sethead,.setrow{grid-template-columns:27px repeat(3,minmax(0,1fr));gap:5px}.tabs button{min-width:77px;font-size:.78rem}.metric{font-size:1.35rem}}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<div id="exerciseModal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="exerciseModalTitle">
 <div class="modal-card"><div class="actions" style="justify-content:space-between;margin-top:0"><strong id="exerciseModalTitle">Exercise</strong><button class="btn secondary small" data-close-exercise aria-label="Close exercise details">Close ✕</button></div><div id="exerciseModalBody"></div></div>
</div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<nav class="tabs" aria-label="Main navigation">
 <button data-tab="dashboard">Home</button><button data-tab="week">Week</button><button data-tab="train">Train</button><button data-tab="history">History</button><button data-tab="progress">Progress</button><button data-tab="body">Body</button><button data-tab="library">Exercises</button><button data-tab="guide">Guide</button><button data-tab="settings">Backup</button>
</nav>
<script>
"use strict";
const KEY="liftlog.v1", REPDB_BASE="https://exercise-dataset.com/";
const PLAN=[
{id:"Monday",kind:"Strength",title:"Strength A",duration:"65–75 min",items:[
["Goblet squat / barbell back squat",2,"8–10","Quads, glutes","Start with goblet squat. Progress to barbell only when bracing, depth and rack safety are reliable."],
["Flat dumbbell bench press",2,"8–12","Chest, triceps","Keep shoulder blades stable; lower under control."],
["Seated cable row",2,"10–12","Back","Pull elbows toward hips without swinging."],
["Dumbbell Romanian deadlift",2,"8–12","Hamstrings, glutes","Soft knees, hips back, neutral spine; stop at your controllable range."],
["Standing dumbbell calf raise",2,"12–15","Calves","Pause briefly at the top and lower fully."],
["Dead bug",2,"8–10/side","Core","Keep lower back gently controlled against the floor."]]},
{id:"Tuesday",kind:"Cardio + mobility",title:"Outdoor aerobic base",duration:"40–50 min",items:[]},
{id:"Wednesday",kind:"Strength",title:"Strength B",duration:"65–75 min",items:[
["Bulgarian split squat",2,"8/leg","Quads, glutes, balance","Use bodyweight or light dumbbells; hold support if needed."],
["Lat pulldown",2,"8–12","Lats, upper back","Pull toward upper chest; avoid leaning far back."],
["Seated dumbbell shoulder press",2,"8–12","Shoulders, triceps","Use a comfortable range and avoid arching your back."],
["Barbell hip thrust",2,"10–12","Glutes","Keep ribs down; finish with hips, not lower-back extension."],
["Cable face pull",2,"12–15","Rear delts, upper back","Pull toward eye level with controlled movement."],
["Side plank",2,"20–30 sec/side","Core","Keep hips stacked; shorten the lever if needed."]]},
{id:"Thursday",kind:"Athletic + conditioning",title:"Athletic foundation",duration:"40–55 min",items:[
["Bodyweight squat",2,"10","Movement control","Comfortable depth, controlled reps."],
["Reverse lunge",2,"8/leg","Single-leg control","Shorten range or use support if balance is limited."],
["Incline push-up",2,"8–12","Upper-body control","Use a bench or stable elevated surface."],
["Low-impact lateral shuffle",3,"15–20 sec","Coordination","Short, quiet steps at an easy pace; no hard cutting."],
["Bird dog",2,"8/side","Trunk stability","Move slowly without rotating your hips."],
["Single-leg balance",2,"20–30 sec/side","Balance","Stand near support; progress gradually."]]},
{id:"Friday",kind:"Strength",title:"Strength C",duration:"65–75 min",items:[
["Leg press",2,"10–12","Quads, glutes","Use a comfortable depth; keep pelvis supported."],
["Incline dumbbell bench press",2,"8–12","Upper chest, triceps","Use a modest bench incline."],
["One-arm dumbbell row",2,"10–12/arm","Back","Support yourself on the bench; avoid torso rotation."],
["Seated leg curl",2,"10–12","Hamstrings","Control both directions."],
["Seated dumbbell calf raise",2,"12–15","Soleus, calves","Use a comfortable range and pause at the top."],
["Farmer carry",3,"20–30 m","Grip, trunk, posture","Walk tall with controlled steps."]]},
{id:"Saturday",kind:"Optional recovery",title:"Easy walk + gentle mobility",duration:"20–40 min",items:[]},
{id:"Sunday",kind:"Rest",title:"Rest day",duration:"—",items:[]}
];
const WARM=["Easy walk or gentle movement — 4–5 min","Ankle rocks — 10/side","Leg swings — 10 forward/back and 10 side-to-side per leg","Arm circles — 10 each direction","Thoracic rotations — 8/side","For the first compound lift: 1–3 gradually heavier warm-up sets before working sets"];
const MOB=["Half-kneeling hip-flexor stretch — 2 × 20–30 sec/side","Supine hamstring stretch — 2 × 20–30 sec/side","Wall calf stretch — 2 × 20–30 sec/side","Doorway chest stretch — 2 × 20–30 sec","Open-book rotation — 2 × 8/side"];
const DYNAMIC=["Ankle rocks","Leg swings front/back and side-to-side","World's greatest stretch","Thoracic rotations","Arm circles and shoulder rolls"];
const $=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
let state={sessions:[],body:[],conditioning:[],notes:[],settings:{weightKg:72,goal:"athletic"}};
try{const old=JSON.parse(localStorage.getItem(KEY)||"null");if(old&&typeof old==="object")state=Object.assign(state,old)}catch(e){}
["sessions","body","conditioning","notes"].forEach(k=>{if(!Array.isArray(state[k]))state[k]=[]});
state.settings=Object.assign({weightKg:72,goal:"athletic"},state.settings||{});
let tab="dashboard",selected="Monday",exerciseCatalog=[],catalogState="loading",modalReturn=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){toast("Storage is full or unavailable. Export a backup before continuing.");return false}}
function toast(s){const n=$("#toast");n.textContent=s;n.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>n.hidden=true,2600)}
function dayPlan(id){return PLAN.find(x=>x.id===id)||PLAN[0]}
function readiness(x){if(!x||!Array.isArray(x.vals))return null;const v=x.vals.map(Number),scores=[];if(x.vals[0])scores.push((v[0]-1)/4);if(x.vals[1])scores.push((v[1]-1)/4);if(x.vals[2])scores.push((5-v[2])/4);if(x.vals[3])scores.push((5-v[3])/4);return scores.length?Math.round(scores.reduce((a,b)=>a+b,0)/scores.length*100):null}
function readinessText(x){const n=readiness(x);return n===null?"Not enough ratings":n>=75?"Favourable self-check":n>=50?"Mixed signals — adjust if needed":"Recovery may be limited — consider an easier session"}
function dayDone(id){return state.sessions.some(x=>x.day===id&&x.date===today())||state.conditioning.some(x=>x.day===id&&x.date===today())}
function dayDoneThisWeek(id){const start=weekStart(today());return state.sessions.some(x=>x.day===id&&x.date>=start&&x.date<=today())||state.conditioning.some(x=>x.day===id&&x.date>=start&&x.date<=today())}
function recentSessions(n){return state.sessions.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,n)}
function fmtDate(s){if(!s)return "—";return new Date(s+"T12:00:00").toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"})}
function safeNum(v){const n=Number(v);return Number.isFinite(n)?n:0}
function weekStart(date){const d=new Date(date+"T12:00:00");const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return d.toISOString().slice(0,10)}
function exerciseAlias(name){const aliases={"flat dumbbell bench press":"dumbbell bench press","dumbbell romanian deadlift":"romanian deadlift","standing dumbbell calf raise":"standing calf raise","seated dumbbell shoulder press":"dumbbell shoulder press","cable face pull":"face pull","low impact lateral shuffle":"lateral shuffle","one arm dumbbell row":"single arm dumbbell row","seated dumbbell calf raise":"seated calf raise","goblet squat / barbell back squat":"goblet squat","incline dumbbell bench press":"incline dumbbell bench press","barbell hip thrust":"hip thrust"};return aliases[String(name).toLowerCase()]||name}
function norm(s){return String(s||"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim()}
function findExercise(name){if(!exerciseCatalog.length)return null;const n=norm(name),a=norm(exerciseAlias(name));return exerciseCatalog.find(e=>norm(e.name_en)===n)||exerciseCatalog.find(e=>norm(e.name_en)===a)||exerciseCatalog.find(e=>a.length>5&&(norm(e.name_en).includes(a)||a.includes(norm(e.name_en))))||null}
function exImgs(e){const f=e&&e.images&&e.images.flat||{};return {start:f.start||f.main||"",peak:f.peak||""}}
function asset(p){try{return p?new URL(p,REPDB_BASE).href:""}catch(e){return ""}}
async function loadExerciseCatalog(){try{const r=await fetch(REPDB_BASE+"exercises.json",{cache:"force-cache"});if(!r.ok)throw Error("Catalog request failed");const j=await r.json();exerciseCatalog=Array.isArray(j)?j:(j.exercises||[]);if(!exerciseCatalog.length)throw Error("Empty catalog");catalogState="ready"}catch(e){catalogState="error"}if(tab==="library")render();if(tab==="train")document.querySelectorAll("[data-exercise-name]").forEach(fillDemo)}
function fillDemo(el){const e=findExercise(el.dataset.exerciseName);if(!e){el.innerHTML='<span class="muted small">Illustration not available for this exact exercise. Open the library to find a close alternative.</span>';return}const im=exImgs(e),src=asset(im.start||im.peak);el.innerHTML='<img loading="lazy" src="'+esc(src)+'" alt="'+esc(e.name_en)+'"><div class="demo-copy"><b>'+esc(e.name_en)+'</b><span>'+esc((e.primary_muscles||[]).join(", "))+'</span><button class="btn secondary small" data-view-exercise="'+esc(e.id)+'">Details</button></div>'}
function exCard(e){const im=exImgs(e),src=asset(im.start||im.peak);return '<button class="library-card" data-view-exercise="'+esc(e.id)+'"><img loading="lazy" src="'+esc(src)+'" alt=""><b>'+esc(e.name_en)+'</b><span>'+esc(e.equipment||"Bodyweight")+' · '+esc(e.body_part||"")+'</span></button>'}
function library(){if(catalogState==="loading")return '<h1>Exercise library</h1><section class="card">Loading exercise catalogue and illustrations…</section>';if(catalogState!=="ready")return '<h1>Exercise library</h1><section class="card">The RepDB catalogue could not be loaded. Your workout log is unaffected.<div class="actions"><button class="btn secondary" data-retry-catalog>Retry</button></div></section>';const eq=[...new Set(exerciseCatalog.map(e=>e.equipment).filter(Boolean))].sort();return '<h1>Exercise library</h1><p class="muted">Search exercise names, muscle groups or equipment. Select an exercise to view its start/peak positions and instructions.</p><div class="library-tools"><input id="exSearch" placeholder="Search exercises, muscles or equipment…" aria-label="Search exercises"><select id="exEquipment" aria-label="Filter by equipment"><option value="">All equipment</option>'+eq.map(x=>'<option>'+esc(x)+'</option>').join("")+'</select></div><p class="muted small" id="exCount">'+exerciseCatalog.length+' exercises</p><div class="library-grid" id="exGrid">'+exerciseCatalog.slice(0,90).map(exCard).join("")+'</div><p class="muted small">Showing up to 90 matches. Refine your search to explore more. Exercise data by <a href="https://repdb.co" target="_blank" rel="noopener">RepDB</a>.</p>'}
function filterLibrary(){const q=($("#exSearch")?.value||"").toLowerCase(),eq=$("#exEquipment")?.value||"",a=exerciseCatalog.filter(e=>(!eq||e.equipment===eq)&&(!q||[e.name_en,e.body_part,e.equipment,...(e.primary_muscles||[]),...(e.secondary_muscles||[])].join(" ").toLowerCase().includes(q)));$("#exGrid").innerHTML=a.slice(0,90).map(exCard).join("")||'<p class="muted">No matches found.</p>';$("#exCount").textContent=a.length+" matching exercises · showing up to 90"}
function closeExercise(){const m=$("#exerciseModal");m.classList.remove("open");m.setAttribute("aria-hidden","true");document.body.style.overflow="";if(modalReturn&&document.contains(modalReturn))modalReturn.focus();modalReturn=null}
function viewExercise(id){const e=exerciseCatalog.find(x=>String(x.id)===String(id));if(!e)return;modalReturn=document.activeElement;const im=exImgs(e),poses=[];if(im.start)poses.push('<figure><img src="'+esc(asset(im.start))+'" alt="Starting position"><figcaption class="small muted">Start</figcaption></figure>');if(im.peak)poses.push('<figure><img src="'+esc(asset(im.peak))+'" alt="Peak position"><figcaption class="small muted">Peak</figcaption></figure>');$("#exerciseModalTitle").textContent=e.name_en;$("#exerciseModalBody").innerHTML='<div class="poses">'+poses.join("")+'</div><p>'+esc(e.description_en||"")+'</p><p><b>Equipment:</b> '+esc(e.equipment||"Bodyweight")+' · <b>Body part:</b> '+esc(e.body_part||"")+'</p><p><b>Primary muscles:</b> '+esc((e.primary_muscles||[]).join(", "))+'</p><p><b>Secondary muscles:</b> '+esc((e.secondary_muscles||[]).join(", "))+'</p><h3>Instructions</h3><ol>'+((e.instructions_en||[]).map(x=>"<li>"+esc(x)+"</li>").join("")||"<li>Follow a controlled, comfortable range of motion.</li>")+'</ol><h3>Tips</h3><ul>'+((e.tips_en||[]).map(x=>"<li>"+esc(x)+"</li>").join("")||"<li>Use a load that allows consistent technique.</li>")+'</ul><p class="small">Exercise data by <a href="https://repdb.co" target="_blank" rel="noopener">RepDB</a>.</p>';$("#exerciseModal").classList.add("open");$("#exerciseModal").setAttribute("aria-hidden","false");document.body.style.overflow="hidden";$("[data-close-exercise]").focus()}
function progressBar(p){return '<div class="progressbar"><span style="width:'+Math.max(0,Math.min(100,p))+'%"></span></div>'}
function dashboard(){const strength=state.sessions.length,weekCount=PLAN.filter(d=>["Monday","Tuesday","Wednesday","Thursday","Friday"].includes(d.id)&&dayDoneThisWeek(d.id)).length,weekPct=Math.round(weekCount/5*100),last=recentSessions(1)[0],recs=(state.notes||[]).slice().sort((a,b)=>b.date.localeCompare(a.date)),r=recs[0],weight=state.body.filter(x=>x.kg).sort((a,b)=>a.date.localeCompare(b.date)).slice(-1)[0];const d=PLAN.find(x=>x.id===new Date().toLocaleDateString("en-US",{weekday:"long"}))||PLAN[0];return '<h1>Lift Log</h1><p class="muted">Your strength, athletic development and recovery dashboard.</p><section class="card hero"><div class="grid"><div><span class="pill">Training focus</span><div class="metric">Athletic foundation</div><span class="muted small">Strength · muscle · mobility · conditioning</span></div><div><span class="pill">Today</span><div class="metric">'+d.id+'</div><span class="muted small">'+d.title+'</span></div><div><span class="pill">Plan duration</span><div class="metric">8 weeks</div><span class="muted small">Build gradually</span></div></div><div class="actions"><button class="btn" data-start-day="'+d.id+'">Open today’s session</button><button class="btn secondary" data-tab="week">View full week</button></div></section><div class="grid"><section class="card"><span class="muted small">Strength sessions logged</span><div class="metric">'+strength+'</div></section><section class="card"><span class="muted small">Current week activity</span><div class="metric">'+weekCount+'/5</div>'+progressBar(weekPct)+'<span class="muted tiny">Counts Monday–Friday plan sessions</span></section><section class="card"><span class="muted small">Latest bodyweight</span><div class="metric">'+(weight?weight.kg+" kg":"—")+'</div><span class="muted tiny">'+(weight?fmtDate(weight.date):"Add a body measurement")+'</span></section></div><section class="card"><h2>Today’s plan</h2><p><b>'+d.title+'</b> · '+d.duration+' · '+d.kind+'</p><p class="muted small">'+(d.items.length?d.items.length+" exercises and "+d.items.reduce((n,x)=>n+x[1],0)+" working sets":d.id==="Tuesday"?"Outdoor aerobic base, mobility and balance":d.id==="Thursday"?"Low-impact athletic circuit and conditioning":"Recovery or rest")+'</p><button class="btn secondary small" data-start-day="'+d.id+'">Open session</button></section><section class="card"><h2>Latest recovery check</h2>'+(r?'<div class="metric">'+(readiness(r)===null?"—":readiness(r)+"/100")+'</div><p class="muted small">'+esc(readinessText(r))+' · self-check only</p><p>'+fmtDate(r.date)+' · Sleep '+esc(r.vals?.[0]||"—")+'/5 · Energy '+esc(r.vals?.[1]||"—")+'/5 · Soreness '+esc(r.vals?.[2]||"—")+'/5 · Joint/tendon '+esc(r.vals?.[3]||"—")+'/5</p><p class="muted small">'+esc(r.note||"No notes")+'</p>':'<p class="muted">No recovery check logged yet. Record one in Body & recovery.</p>')+'<button class="btn secondary small" data-tab="body">Open recovery log</button></section><section class="card"><h2>Recent training</h2>'+(last?'<div class="listitem"><span>'+fmtDate(last.date)+' · '+esc(last.day)+'</span><button class="btn secondary small" data-tab="history">View history</button></div>':'<p class="muted">Your saved sessions will appear here.</p>')+'</section>'}
function week(){return '<h1>Your training week</h1><p class="muted">Three strength sessions, two lower-stress conditioning/mobility days, one optional recovery day and one full rest day.</p><section class="card hero"><div class="grid"><div><span class="pill">Goal</span><div class="metric">Athletic</div></div><div><span class="pill">Frequency</span><div class="metric">5 days</div></div><div><span class="pill">Session cap</span><div class="metric">75 min</div></div></div><p class="small muted">Start with technique and consistency. Optional Saturday is not required to complete the programme.</p></section>'+PLAN.map(d=>'<section class="card"><div class="listitem"><div><h3>'+d.id+' — '+d.title+'</h3><span class="pill">'+d.kind+'</span> <span class="muted small">'+d.duration+'</span></div><div class="actions" style="margin:0"><span class="'+(dayDone(d.id)?"good":"muted")+' small">'+(dayDone(d.id)?"Logged today":"")+'</span><button class="btn secondary small" data-start-day="'+d.id+'">Open</button></div></div>'+(d.items.length?'<p class="muted small">'+d.items.length+' exercises · '+d.items.reduce((a,x)=>a+x[1],0)+' working sets</p><ul>'+d.items.map(x=>'<li>'+esc(x[0])+' — '+x[1]+' × '+esc(x[2])+'</li>').join("")+'</ul>':d.id==="Tuesday"?'<p>5 min easy walk · 25–35 min brisk walk · 8–10 min mobility · single-leg balance 2 × 20–30 sec/side</p>':d.id==="Thursday"?'<p>15–20 min brisk walk · bodyweight squat · reverse lunge · incline push-up · low-impact lateral shuffle · bird dog · single-leg balance</p>':d.id==="Saturday"?'<p>Optional easy walk and gentle mobility. Keep this restorative.</p>':'<p>Full rest. Normal daily movement is fine.</p>')+'</section>').join("")+'<section class="card"><h2>Weekly training rules</h2><ul><li>Keep Tuesday conversational: you should be able to speak in full sentences.</li><li>Thursday stays low-to-moderate effort. If you are still sore from Wednesday, replace lower-body moves with mobility and an easy walk.</li><li>Do not make up missed sessions by stacking hard workouts together.</li><li>Sunday is rest; Saturday remains optional.</li></ul></section>'}
function warmupHtml(){return '<ol>'+WARM.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ol>'}
function mobilityHtml(){return '<ol>'+MOB.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ol>'}
function conditionContent(id){if(id==="Tuesday")return '<section class="card"><h2>Outdoor aerobic base</h2><ol><li>Easy walk — 5 min</li><li>Brisk outdoor walk — 25–35 min, conversational pace</li><li>Mobility sequence — 8–10 min: ankle rocks, leg swings, world’s greatest stretch and thoracic rotations</li><li>Single-leg balance — 2 × 20–30 sec/side</li></ol><p class="notice">Keep the effort easy to moderate. If you cannot speak comfortably, slow down.</p></section>';if(id==="Thursday")return '<section class="card"><h2>Athletic foundation circuit</h2><p>Begin with a 15–20 min brisk outdoor walk, then complete at a controlled pace:</p><ol><li>Bodyweight squat — 2 × 10</li><li>Reverse lunge — 2 × 8/leg</li><li>Incline push-up — 2 × 8–12</li><li>Low-impact lateral shuffle — 3 × 15–20 sec</li><li>Bird dog — 2 × 8/side</li><li>Single-leg balance — 2 × 20–30 sec/side</li></ol><p class="notice">If still sore after Wednesday, replace lower-body exercises with gentle mobility and an easy walk. No maximal sprints or hard cutting.</p></section>';return '<section class="card"><h2>Recovery day</h2><p>Optional easy walk for 20–40 minutes and gentle mobility. Stop well before fatigue. Sunday is the full rest day.</p></section>'}
function conditionForm(day){return '<section class="card"><h2>Log this activity</h2><div class="field"><label>Date</label><input type="date" id="condDate" value="'+today()+'"></div><div class="two"><div class="field"><label>Duration (minutes)</label><input type="number" id="condMin" min="1" max="600" placeholder="e.g. 35"></div><div class="field"><label>Effort (RPE 1–10)</label><input type="number" id="condRpe" min="1" max="10" placeholder="e.g. 4"></div></div><div class="field"><label>Activity / notes</label><input id="condNote" placeholder="Brisk walk, mobility, balance…"></div><button class="btn" data-save-cond="'+day+'">Save activity</button></section>'}
function sessionNav(){const i=PLAN.findIndex(x=>x.id===selected),prev=PLAN[(i+PLAN.length-1)%PLAN.length],next=PLAN[(i+1)%PLAN.length];return '<div class="actions"><button class="btn secondary small" data-start-day="'+prev.id+'">← '+prev.id+'</button><button class="btn secondary small" data-start-day="'+next.id+'">'+next.id+' →</button><button class="btn secondary small" data-tab="week">Full week</button></div>'}
function workout(){const d=dayPlan(selected);if(!d.items.length)return '<h1>'+d.title+'</h1><p class="muted">'+d.id+' · '+d.duration+'</p>'+sessionNav()+conditionContent(d.id)+conditionForm(d.id);return '<h1>'+d.title+'</h1><p class="muted">'+d.id+' · '+d.duration+' · '+d.items.length+' exercises</p>'+sessionNav()+'<section class="card"><h2>Before you start</h2><p class="muted small">Tick each warm-up item as you complete it. These checks are temporary and are not stored in the workout history.</p>'+WARM.map((x,i)=>'<label class="checkrow"><input type="checkbox" class="warmcheck"><span>'+esc(x)+'</span></label>').join("")+'</section><section class="card"><h2>Working sets</h2><p class="muted small">Record completed kg, reps and RIR for every set. RIR means how many more good reps you could have completed. Do not log warm-up sets here.</p><div class="field"><label>Session date</label><input id="sessionDate" type="date" value="'+today()+'"></div>'+d.items.map((x,i)=>'<div class="exercise"><h3>'+(i+1)+'. '+esc(x[0])+'</h3><div class="exercise-demo" data-exercise-name="'+esc(x[0])+'"><span class="muted small">Loading illustration…</span></div><p>'+x[1]+' sets · '+esc(x[2])+' reps · '+esc(x[3])+'</p><p>'+esc(x[4])+'</p><div class="sethead"><span>Set</span><span>kg</span><span>Reps</span><span>RIR</span></div>'+Array.from({length:x[1]},(_,j)=>'<div class="setrow"><span>'+(j+1)+'</span><input type="number" min="0" step=".5" placeholder="kg" data-entry="'+i+'-'+j+'-w" aria-label="'+esc(x[0])+' set '+(j+1)+' weight in kg"><input type="number" min="1" step="1" placeholder="reps" data-entry="'+i+'-'+j+'-r" aria-label="'+esc(x[0])+' set '+(j+1)+' reps"><input type="number" min="0" max="10" step="1" placeholder="RIR" value="3" data-entry="'+i+'-'+j+'-i" aria-label="'+esc(x[0])+' set '+(j+1)+' reps in reserve"></div>').join("")+'<div class="field"><label>Substitute / variation (optional)</label><input data-substitute="'+i+'" placeholder="Record a variation if you changed this exercise"></div></div>').join("")+'<div class="field"><label>Session notes</label><textarea id="sessionNotes" rows="2" placeholder="Technique, energy, discomfort, substitutions…"></textarea></div><button class="btn" data-save-session="'+d.id+'">Save strength session</button></section><section class="card"><h2>After training: optional static mobility</h2>'+mobilityHtml()+'<p class="muted small">Stretch gently without pain. You can do this after the session or separately.</p></section>'}
function history(){const ss=state.sessions.slice().sort((a,b)=>b.date.localeCompare(a.date)),cc=state.conditioning.slice().sort((a,b)=>b.date.localeCompare(a.date));return '<h1>Training history</h1><section class="card"><div class="grid"><div><span class="muted small">Strength sessions</span><div class="metric">'+ss.length+'</div></div><div><span class="muted small">Activities</span><div class="metric">'+cc.length+'</div></div></div></section><h2>Strength sessions</h2>'+(ss.length?ss.map(s=>'<section class="card"><div class="listitem"><div><strong>'+fmtDate(s.date)+' · '+esc(s.day)+'</strong><div class="muted tiny">'+Object.keys(s.sets||{}).length+' exercises · '+Object.values(s.sets||{}).reduce((n,a)=>n+a.length,0)+' sets</div></div><button class="btn danger small" data-delete-session="'+esc(s.id)+'">Delete</button></div>'+Object.entries(s.sets||{}).map(([n,a])=>'<div class="listitem"><span>'+esc(n)+(s.substitutions&&s.substitutions[n]?' <span class="muted tiny">('+esc(s.substitutions[n])+')</span>':"")+'</span><span class="muted small">'+a.map(x=>esc(x.w)+'kg × '+esc(x.r)+' · RIR '+esc(x.rir)).join(" / ")+'</span></div>').join("")+(s.notes?'<p class="muted small">'+esc(s.notes)+'</p>':"")+'</section>').join(""):'<p class="empty">No strength sessions logged yet.</p>')+'<h2>Cardio, mobility and athletic activity</h2>'+(cc.length?cc.map(x=>'<section class="card"><div class="listitem"><div><strong>'+fmtDate(x.date)+' · '+esc(x.day)+'</strong><div class="muted small">'+esc(x.minutes)+' min · RPE '+esc(x.rpe||"—")+'</div></div><button class="btn danger small" data-delete-cond="'+esc(x.id)+'">Delete</button></div><p class="muted small">'+esc(x.note||"Activity")+'</p></section>').join(""):'<p class="empty">No activities logged yet.</p>')}
function perfRows(){const map={};state.sessions.forEach(s=>Object.entries(s.sets||{}).forEach(([name,sets])=>{const best=Math.max(0,...sets.map(x=>safeNum(x.w)*safeNum(x.r)));(map[name]||(map[name]=[])).push({date:s.date,best,sets:sets})}));const names=Object.keys(map);if(!names.length)return '<p class="muted">Log strength sessions to see per-exercise trends and personal records.</p>';return names.map(name=>{const a=map[name].sort((x,y)=>x.date.localeCompare(y.date)),last=a[a.length-1],pr=Math.max(...a.map(x=>x.best)),prev=a.length>1?a[a.length-2]:null;return '<div class="listitem"><div><strong>'+esc(name)+'</strong><div class="muted small">Latest load × reps: '+last.best+' · Best logged: '+pr+' · '+fmtDate(last.date)+'</div></div><span class="'+(prev&&last.best>prev.best?"good":"muted")+'">'+(prev?(last.best>prev.best?"↑ improving":last.best<prev.best?"↓ lower":"→ steady"):"New")+'</span></div>'}).join("")+'<p class="muted tiny">Load × reps is a simple performance comparison, not a 1RM estimate. Compare like-for-like equipment and technique.</p>'}
function chartBars(items,labelKey,valueKey){if(!items.length)return '<p class="muted">Not enough data to chart yet.</p>';const max=Math.max(1,...items.map(x=>safeNum(x[valueKey])));return '<div class="chart">'+items.map(x=>'<div class="barwrap" title="'+esc(x[labelKey])+': '+esc(x[valueKey])+'"><div class="bar" style="height:'+Math.max(2,safeNum(x[valueKey])/max*100)+'%"></div><span class="barlabel">'+esc(x[labelKey])+'</span></div>').join("")+'</div>'}
function progress(){const weeks={};state.sessions.forEach(s=>{const k=weekStart(s.date);weeks[k]=(weeks[k]||0)+1});state.conditioning.forEach(s=>{const k=weekStart(s.date);weeks[k]=(weeks[k]||0)+1});const wk=Object.keys(weeks).sort().slice(-8).map(k=>({week:k.slice(5),count:weeks[k]}));const weights=state.body.filter(x=>x.kg).sort((a,b)=>a.date.localeCompare(b.date)),latest=weights[weights.length-1],first=weights[0];const totalMins=state.conditioning.reduce((a,x)=>a+safeNum(x.minutes),0);return '<h1>Progress & performance</h1><div class="grid"><section class="card"><span class="muted small">Strength sessions</span><div class="metric">'+state.sessions.length+'</div></section><section class="card"><span class="muted small">Conditioning minutes</span><div class="metric">'+totalMins+'</div></section><section class="card"><span class="muted small">Latest bodyweight</span><div class="metric">'+(latest?latest.kg+" kg":"—")+'</div></section></div><section class="card"><h2>Weekly consistency</h2>'+chartBars(wk,"week","count")+'<p class="muted tiny">Combined strength sessions and logged activities by calendar week. A sustainable routine matters more than a perfect week.</p></section><section class="card"><h2>Exercise-by-exercise progress</h2>'+perfRows()+'</section><section class="card"><h2>Bodyweight trend</h2>'+(weights.length?'<p class="metric">'+latest.kg+' kg</p><p class="muted small">'+fmtDate(first.date)+' → '+fmtDate(latest.date)+' · '+(weights.length>1?(safeNum(latest.kg)-safeNum(first.kg)>0?"+":"")+(safeNum(latest.kg)-safeNum(first.kg)).toFixed(1)+" kg change":"One measurement so far")+'</p>'+chartBars(weights.slice(-8).map(x=>({date:x.date.slice(5),kg:x.kg})),"date","kg"):'<p class="muted">Add bodyweight entries to see a trend.</p>')+'</section><section class="card"><h2>Waist trend</h2>'+(state.body.filter(x=>x.waist).length?chartBars(state.body.filter(x=>x.waist).sort((a,b)=>a.date.localeCompare(b.date)).slice(-8).map(x=>({date:x.date.slice(5),cm:x.waist})),"date","cm"):'<p class="muted">Add waist measurements in Body & recovery to see a trend.</p>')+'</section><section class="card"><h2>8-week review</h2><ul><li>Are exercise techniques more consistent?</li><li>Are reps or loads gradually improving?</li><li>Is sleep and recovery adequate?</li><li>Any recurring joint or tendon symptoms?</li><li>Is the schedule sustainable?</li></ul></section>'}
function recoveryList(){const entries=state.notes.slice().sort((a,b)=>b.date.localeCompare(a.date));return '<h3 style="margin-top:18px">Recovery history</h3>'+(entries.length?entries.map((x,i)=>'<div class="listitem"><div><strong>'+fmtDate(x.date)+'</strong><div class="muted small">Sleep '+esc(x.vals?.[0]||"—")+'/5 · Energy '+esc(x.vals?.[1]||"—")+'/5 · Soreness '+esc(x.vals?.[2]||"—")+'/5 · Joint/tendon '+esc(x.vals?.[3]||"—")+'/5'+(x.note?'<br>'+esc(x.note):"")+'</div></div><button class="btn danger small" data-delete-recovery="'+i+'">Delete</button></div>').join(""):'<p class="muted small">No recovery checks recorded yet.</p>')}
function body(){const b=state.body.slice().sort((a,b)=>b.date.localeCompare(a.date)),latest=state.notes.slice().sort((a,b)=>b.date.localeCompare(a.date))[0];return '<h1>Body & recovery</h1><section class="card"><h2>Record body measurements</h2><div class="field"><label>Date</label><input type="date" id="bodyDate" value="'+today()+'"></div><div class="two"><div class="field"><label>Bodyweight (kg)</label><input type="number" id="bodyKg" min="0" step=".1" placeholder="e.g. 72.0"></div><div class="field"><label>Waist (cm), optional</label><input type="number" id="bodyWaist" min="0" step=".1" placeholder="e.g. 82.0"></div></div><button class="btn" data-save-body>Save measurements</button></section><section class="card"><h2>Measurement history</h2>'+(b.length?b.map(x=>'<div class="listitem"><span>'+fmtDate(x.date)+'</span><span>'+ (x.kg?esc(x.kg)+" kg":"")+' '+(x.waist?esc(x.waist)+" cm waist":"")+'</span><button class="btn danger small" data-delete-body="'+esc(x.date)+'">Delete</button></div>').join(""):'<p class="muted">No measurements recorded.</p>')+'</section><section class="card"><h2>Readiness self-check</h2>'+(latest?'<div class="metric">'+(readiness(latest)===null?"—":readiness(latest)+"/100")+'</div><p class="muted small">'+esc(readinessText(latest))+'</p>':'<p class="muted">Complete a recovery check to see your indicator.</p>')+'<p class="muted tiny">This simple trend indicator is not a medical assessment and should not override how you feel.</p><h2>Daily recovery check</h2><p class="muted small">Rate each from 1–5. For soreness and joint/tendon symptoms, 1 means none/low and 5 means severe/high. This is a self-check, not a medical assessment.</p><div class="grid">'+["Sleep quality","Energy","Muscle soreness","Joint/tendon symptoms"].map((x,i)=>'<div class="field"><label>'+x+' (1–5)</label><select id="rec'+i+'"><option value="">Not recorded</option><option value="1">1 — Low</option><option value="2">2 — Below average</option><option value="3">3 — Moderate</option><option value="4">4 — Good / high</option><option value="5">5 — Excellent / high</option></select></div>').join("")+'</div><div class="field"><label>Notes</label><input id="recNote" placeholder="Anything affecting today’s training?"></div><button class="btn" data-save-recovery>Save recovery check</button>'+recoveryList()+'</section><section class="card"><h2>Recovery guidance</h2><ul><li>Aim for 7–9 hours of sleep.</li><li>Persistent fatigue, worsening soreness or poor sleep are reasons to reduce training stress.</li><li>Sharp or worsening pain is not a normal training target. Modify or stop the painful movement.</li></ul><p class="muted small">If symptoms persist, seek assessment from a qualified clinician.</p></section>'}
function guide(){return '<h1>Training guide</h1><section class="card"><h2>Warm-up before strength sessions</h2><p class="muted small">Warm up enough to move well; do not turn the warm-up into a workout.</p>'+warmupHtml()+'<p>Then perform 1–3 progressively heavier warm-up sets for the first compound lift, increasing load gradually and keeping reps easy.</p></section><section class="card"><h2>Dynamic mobility</h2><p>Use these before activity or on mobility days. Move smoothly through a comfortable range.</p><ul>'+DYNAMIC.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul><p class="muted small">Tuesday mobility sequence: ankle rocks, leg swings, world’s greatest stretch and thoracic rotations for 8–10 minutes.</p></section><section class="card"><h2>Static mobility after training</h2>'+mobilityHtml()+'<p class="muted small">Hold a mild stretch for 20–30 seconds. Do not force range or stretch into pain.</p></section><section class="card"><h2>Effort, reps and rest</h2><ul><li>Weeks 1–2: finish most sets with 3–4 reps in reserve (RIR).</li><li>Rest 2–3 minutes after demanding compound lifts and 60–120 seconds after accessory exercises.</li><li>Use controlled repetitions and stop when technique breaks down.</li><li>No 1RM testing and no need to train to failure.</li></ul></section><section class="card"><h2>Double progression</h2><ol><li>Choose a load that lets you complete the bottom of the rep range with good form and the planned RIR.</li><li>Add reps gradually while keeping technique and effort consistent.</li><li>When every working set reaches the top of its rep range with good form and target RIR, add the smallest practical load increase.</li><li>Build reps again. If performance drops sharply or form changes, reduce load and rebuild.</li></ol></section><section class="card"><h2>Eight-week progression block</h2><ol><li><b>Weeks 1–2 — Learn:</b> two working sets, 3–4 RIR, technique and consistency.</li><li><b>Weeks 3–4 — Build reps:</b> add reps; consider a third set on selected main lifts only if recovery is good.</li><li><b>Weeks 5–6 — Progress:</b> gradually add load or selected volume, not everything at once.</li><li><b>Weeks 7–8 — Consolidate:</b> maintain quality, compare logs and review recovery before the next block.</li></ol><p class="notice">Progression is conditional. If recovery, sleep or technique deteriorates, hold volume/load steady or reduce it.</p></section><section class="card"><h2>Nutrition basics</h2><ul><li>At '+esc(state.settings.weightKg)+' kg reference bodyweight, a practical starting protein range is about '+Math.round(state.settings.weightKg*1.6)+'–'+Math.round(state.settings.weightKg*2)+' g/day (roughly 1.6–2.0 g/kg).</li><li>Spread protein across 3–5 meals using foods you enjoy and tolerate.</li><li>Start around maintenance calories; adjust based on several weeks of bodyweight, performance and appetite trends rather than using an aggressive bulk or cut.</li><li>Include vegetables, fruit, fibre-rich carbohydrates and dietary fats. Drink regularly, especially in hot weather.</li><li>Creatine monohydrate 3–5 g/day is optional for healthy adults. Discuss it with a clinician first if you have kidney disease, relevant medical conditions or take medicines that affect kidney function.</li><li>Do not take a routine vitamin stack. Supplement specific nutrients when dietary intake, clinical advice or a confirmed deficiency indicates a need.</li></ul><p class="muted small">This is general education, not a personalised medical or dietetic prescription.</p></section><section class="card"><h2>Recovery and pain rules</h2><ul><li>Aim for 7–9 hours of sleep and keep rest days genuinely easy.</li><li>Ordinary muscle soreness can occur; sharp, worsening or persistent joint/tendon pain is different.</li><li>Reduce or stop a painful movement rather than pushing through it. Persistent pain, swelling or loss of function warrants clinical assessment.</li><li>Saturday is optional recovery; Sunday is rest.</li></ul></section><section class="card"><h2>Equipment and substitutions</h2><p>The programme assumes barbells and racks, dumbbells up to 40 kg, cables, lat pulldown/seated row, leg press/leg curl, chest/shoulder press machines, and flat/adjustable benches. Cardio is outdoors; no indoor cardio machine is assumed.</p><p>If equipment is unavailable, use a comfortable equivalent movement pattern, reduce load as needed and record the substitution in session notes. Never substitute a movement that causes pain.</p></section>'}
function settings(){return '<h1>Backup & settings</h1><section class="card"><h2>Your data</h2><p class="muted small">Your training data is saved in this browser on this device. It is not automatically synchronised to the cloud or between devices. Export backups regularly.</p><div class="actions"><button class="btn" data-export>Export JSON backup</button><button class="btn secondary" data-import>Import backup</button><input hidden type="file" id="importFile" accept="application/json"></div></section><section class="card"><h2>Training profile</h2><div class="field"><label>Current reference bodyweight (kg)</label><input type="number" id="profileWeight" min="1" max="400" step=".1" value="'+esc(state.settings.weightKg||72)+'"></div><div class="field"><label>Primary goal</label><select id="profileGoal"><option value="athletic" '+(state.settings.goal==="athletic"?"selected":"")+'>Athletic development</option><option value="muscle" '+(state.settings.goal==="muscle"?"selected":"")+'>Muscle gain</option><option value="strength" '+(state.settings.goal==="strength"?"selected":"")+'>Strength</option><option value="general" '+(state.settings.goal==="general"?"selected":"")+'>General fitness</option></select></div><button class="btn" data-save-settings>Save profile</button><p class="muted tiny">Profile weight is a reference for nutrition guidance. Your dated body measurements remain separate.</p></section><section class="card"><h2>Data management</h2><p class="notice">Importing a backup replaces the current local training data. Export your current data first if you may need it.</p><button class="btn danger" data-clear-data>Clear all local training data</button></section><section class="card"><h2>Exercise illustrations</h2><p>Exercise information and still-image illustrations are loaded from the RepDB public exercise catalogue when online. The app does not host or bundle those exercise assets.</p><p class="muted small">Exercise data by <a href="https://repdb.co" target="_blank" rel="noopener">RepDB</a>.</p></section>'}
function render(){document.querySelectorAll("[data-tab]").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));const pages={dashboard:dashboard,week:week,train:workout,history:history,progress:progress,body:body,library:library,guide:guide,settings:settings};$("#app").innerHTML=pages[tab]();if(tab==="train")document.querySelectorAll("[data-exercise-name]").forEach(fillDemo)}
function startDay(day){selected=day;tab="train";render();window.scrollTo(0,0)}
function saveStrength(day){const def=dayPlan(day),sets={},substitutions={};let invalid=false;def.items.forEach((x,i)=>{const a=[];for(let j=0;j<x[1];j++){const get=k=>document.querySelector('[data-entry="'+i+"-"+j+"-"+k+'"]')?.value;const w=get("w"),r=get("r"),rir=get("i");if(w!==""||r!==""){if(w===""||r===""){invalid=true;continue}const wn=Number(w),rn=Number(r),inr=rir===""?3:Number(rir);if(!Number.isFinite(wn)||wn<0||!Number.isInteger(rn)||rn<1||!Number.isFinite(inr)||inr<0||inr>10){invalid=true;continue}a.push({w:wn,r:rn,rir:inr})}}if(a.length)sets[x[0]]=a;const sub=document.querySelector('[data-substitute="'+i+'"]')?.value;if(sub)substitutions[x[0]]=sub});if(invalid){toast("Complete both weight and reps for each entered set, and check the RIR values.");return}if(!Object.keys(sets).length){toast("Enter weight and reps for at least one set.");return}const date=$("#sessionDate").value||today();state.sessions.push({id:Date.now(),date:date,day:day,sets:sets,substitutions:substitutions,notes:$("#sessionNotes").value||""});if(save()){toast("Strength session saved.");tab="history";render()}}
function saveCondition(day){const minutes=Number($("#condMin").value),rpe=$("#condRpe").value;if(!Number.isInteger(minutes)||minutes<1||minutes>600)return toast("Enter a valid activity duration.");if(rpe!==""&&(!Number.isInteger(Number(rpe))||Number(rpe)<1||Number(rpe)>10))return toast("Effort must be between 1 and 10.");state.conditioning.push({id:Date.now(),date:$("#condDate").value||today(),day:day,minutes:minutes,rpe:rpe?Number(rpe):null,note:$("#condNote").value||""});if(save()){toast("Activity saved.");tab="history";render()}}
function validBackup(o){return o&&typeof o==="object"&&Array.isArray(o.sessions)&&Array.isArray(o.body)&&Array.isArray(o.conditioning||[])&&Array.isArray(o.notes||[])}
function exportBackup(){const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="lift-log-backup-"+today()+".json";document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset;if(d.viewExercise){viewExercise(d.viewExercise);return}if(b.matches("[data-close-exercise]")){closeExercise();return}if(d.tab){tab=d.tab;render();window.scrollTo(0,0);return}if(d.startDay){startDay(d.startDay);return}if(d.retryCatalog){catalogState="loading";render();loadExerciseCatalog();return}if(d.saveSession){saveStrength(d.saveSession);return}if(d.saveCond){saveCondition(d.saveCond);return}if(d.saveBody!==undefined){const kg=$("#bodyKg").value,waist=$("#bodyWaist").value,date=$("#bodyDate").value||today();if(!kg&&!waist)return toast("Enter at least one measurement.");if((kg&&(!Number.isFinite(Number(kg))||Number(kg)<=0))||(waist&&(!Number.isFinite(Number(waist))||Number(waist)<=0)))return toast("Measurements must be positive numbers.");state.body=state.body.filter(x=>x.date!==date);state.body.push({date:date,kg:kg?Number(kg):null,waist:waist?Number(waist):null});if(save()){toast("Measurements saved.");render()}return}if(d.saveRecovery!==undefined){const vals=[0,1,2,3].map(i=>$("#rec"+i).value);if(vals.every(x=>!x)&&!$("#recNote").value.trim())return toast("Enter at least one rating or note.");state.notes.push({id:Date.now(),date:today(),vals:vals,note:$("#recNote").value||""});if(save()){toast("Recovery check saved.");render()}return}if(d.deleteSession){if(confirm("Delete this strength session?")){state.sessions=state.sessions.filter(x=>String(x.id)!==d.deleteSession);save();render()}return}if(d.deleteCond){if(confirm("Delete this activity?")){state.conditioning=state.conditioning.filter(x=>String(x.id)!==d.deleteCond);save();render()}return}if(d.deleteRecovery!==undefined){if(confirm("Delete this recovery check?")){const entries=state.notes.slice().sort((a,b)=>b.date.localeCompare(a.date));const target=entries[Number(d.deleteRecovery)];state.notes=state.notes.filter(x=>x!==target);save();render()}return}if(d.deleteBody){if(confirm("Delete measurements for "+d.deleteBody+"?")){state.body=state.body.filter(x=>x.date!==d.deleteBody);save();render()}return}if(d.export){exportBackup();return}if(d.import){$("#importFile").click();return}if(d.saveSettings!==undefined){const w=Number($("#profileWeight").value);if(!Number.isFinite(w)||w<1||w>400)return toast("Enter a valid reference bodyweight.");state.settings.weightKg=w;state.settings.goal=$("#profileGoal").value;save();toast("Profile saved.");render();return}if(d.clearData){if(confirm("Permanently clear all Lift Log data stored in this browser? Export a backup first if needed.")){state={sessions:[],body:[],conditioning:[],notes:[],settings:{weightKg:72,goal:"athletic"}};save();render();toast("Local data cleared.")}return}});
document.addEventListener("input",e=>{if(e.target.id==="exSearch")filterLibrary()});
document.addEventListener("change",e=>{if(e.target.id==="exEquipment")filterLibrary();if(e.target.id==="importFile"&&e.target.files&&e.target.files[0]){const f=e.target.files[0],fr=new FileReader();fr.onload=()=>{try{const o=JSON.parse(fr.result);if(!validBackup(o))throw Error("Invalid structure");if(!confirm("Replace current Lift Log data with this backup? Export current data first if needed."))return;state={sessions:o.sessions,body:o.body,conditioning:o.conditioning||[],notes:o.notes||[],settings:Object.assign({weightKg:72,goal:"athletic"},o.settings||{})};if(save()){render();toast("Backup restored.")}}catch(err){toast("Invalid Lift Log backup file. Current data was not changed.")}finally{e.target.value=""}};fr.readAsText(f)}});
document.addEventListener("click",e=>{if(e.target.id==="exerciseModal")closeExercise()});
document.addEventListener("keydown",e=>{const m=$("#exerciseModal");if(e.key==="Escape"&&m.classList.contains("open"))closeExercise();if(e.key==="Tab"&&m.classList.contains("open")){const f=m.querySelectorAll("button,a[href],input,select,textarea,[tabindex]:not([tabindex='-1'])");if(!f.length)return;const first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
render();loadExerciseCatalog();
</script>
