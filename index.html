<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101820">
<title>Lift Log — Training & Performance</title>
<style>
:root{color-scheme:dark;--bg:#101820;--panel:#192530;--panel2:#202f3b;--ink:#eef4f7;--mut:#a7b7c2;--line:#334653;--accent:#83e0bb;--accent2:#9db8ff;--warn:#ffd27c;--bad:#ff9d9d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;padding-bottom:82px}
main{max-width:900px;margin:auto;padding:18px}h1{font-size:1.7rem;margin:4px 0 6px}h2{font-size:1.2rem;margin:0 0 10px}h3{font-size:1rem;margin:0}.muted{color:var(--mut)}.small{font-size:.86rem}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px;margin:12px 0}.hero{background:linear-gradient(130deg,#1b3540,#1d293b);border-color:#42606c}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.pill{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:3px 9px;font-size:.78rem;color:var(--mut)}.day{border-top:1px solid var(--line);padding:12px 0}.day:first-child{border:0}.row{display:grid;grid-template-columns:1fr repeat(3,minmax(65px,90px));gap:7px;align-items:center;margin:7px 0}.row label{font-size:.9rem}.row input{min-width:0}.field{display:flex;flex-direction:column;gap:4px;margin:8px 0}.field label{font-size:.83rem;color:var(--mut)}input,select,textarea{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:#111d26;color:var(--ink);font:inherit}button{font:inherit;cursor:pointer}.btn{border:0;border-radius:9px;padding:11px 14px;background:var(--accent);color:#10231d;font-weight:750}.btn.secondary{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn.danger{background:#4b252a;color:#ffdede}.btn.small{padding:6px 10px;font-size:.82rem}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:#121d26;border-top:1px solid var(--line);padding:7px max(6px,env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left));z-index:5}.tabs button{flex:1;max-width:145px;background:none;border:0;color:var(--mut);padding:9px 3px;font-weight:650}.tabs button.active{color:var(--accent)}.exercise{padding:12px 0;border-top:1px solid var(--line)}.exercise:first-child{border:0}.exercise p{margin:4px 0;color:var(--mut);font-size:.88rem}.sethead,.setrow{display:grid;grid-template-columns:35px 1fr 1fr 1fr;gap:7px;align-items:center}.sethead{color:var(--mut);font-size:.78rem;margin:8px 0 4px}.setrow{margin:5px 0}.setrow span{text-align:center;color:var(--mut)}.setrow input{padding:8px 6px}.notice{border-left:3px solid var(--warn);padding:8px 11px;background:#2b2a22;border-radius:5px;color:#f4e5c1}.good{color:var(--accent)}.chart{width:100%;height:180px;background:#111d26;border-radius:9px}.metric{font-size:1.5rem;font-weight:750}.listitem{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line)}details{margin-top:7px}summary{cursor:pointer;color:var(--accent2)}@media(max-width:520px){main{padding:12px}.row{grid-template-columns:1fr 70px 70px 70px}.sethead,.setrow{grid-template-columns:25px 1fr 1fr 1fr}.tabs button{font-size:.78rem}}
</style>
</head>
<body>
<main id="app"></main>
<nav class="tabs" aria-label="Main navigation">
<button data-tab="week">Week</button><button data-tab="train">Train</button><button data-tab="history">History</button><button data-tab="progress">Progress</button><button data-tab="body">Body</button><button data-tab="guide">Guide</button>
</nav>
<script>
const KEY="liftlog.v1";
const PLAN=[
 {id:"Monday",kind:"Strength",title:"Strength A",duration:"65–75 min",items:[
  ["Goblet squat / barbell back squat",2,"8–10","Quads, glutes","Start with goblet squat. Progress to barbell only when bracing, depth and rack safety are reliable."],
  ["Flat dumbbell bench press",2,"8–12","Chest, triceps","Keep shoulder blades stable; lower under control."],
  ["Seated cable row",2,"10–12","Back","Pull elbows toward hips without swinging."],
  ["Dumbbell Romanian deadlift",2,"8–12","Hamstrings, glutes","Soft knees, hips back, neutral spine; stop at your controllable range."],
  ["Standing dumbbell calf raise",2,"12–15","Calves","Pause briefly at the top and lower fully."],
  ["Dead bug",2,"8–10/side","Core","Keep lower back gently controlled against the floor."]
 ]},
 {id:"Tuesday",kind:"Cardio + mobility",title:"Outdoor aerobic base",duration:"40–50 min",items:[]},
 {id:"Wednesday",kind:"Strength",title:"Strength B",duration:"65–75 min",items:[
  ["Bulgarian split squat",2,"8/leg","Quads, glutes, balance","Use bodyweight or light dumbbells; hold support if needed."],
  ["Lat pulldown",2,"8–12","Lats, upper back","Pull toward upper chest; avoid leaning far back."],
  ["Seated dumbbell shoulder press",2,"8–12","Shoulders, triceps","Use a comfortable range and avoid arching your back."],
  ["Barbell hip thrust",2,"10–12","Glutes","Keep ribs down; finish with hips, not lower-back extension."],
  ["Cable face pull",2,"12–15","Rear delts, upper back","Pull toward eye level with controlled movement."],
  ["Side plank",2,"20–30 sec/side","Core","Keep hips stacked; shorten the lever if needed."]
 ]},
 {id:"Thursday",kind:"Athletic + conditioning",title:"Athletic foundation",duration:"40–55 min",items:[
  ["Bodyweight squat",2,"10","Movement control","Comfortable depth, controlled reps."],
  ["Reverse lunge",2,"8/leg","Single-leg control","Shorten range or use support if balance is limited."],
  ["Incline push-up",2,"8–12","Upper-body control","Use a bench or stable elevated surface."],
  ["Low-impact lateral shuffle",3,"15–20 sec","Coordination","Short, quiet steps at an easy pace; no hard cutting."],
  ["Bird dog",2,"8/side","Trunk stability","Move slowly without rotating your hips."],
  ["Single-leg balance",2,"20–30 sec/side","Balance","Stand near support; progress gradually."]
 ]},
 {id:"Friday",kind:"Strength",title:"Strength C",duration:"65–75 min",items:[
  ["Leg press",2,"10–12","Quads, glutes","Use a comfortable depth; keep pelvis supported."],
  ["Incline dumbbell bench press",2,"8–12","Upper chest, triceps","Use a modest bench incline."],
  ["One-arm dumbbell row",2,"10–12/arm","Back","Support yourself on the bench; avoid torso rotation."],
  ["Seated leg curl",2,"10–12","Hamstrings","Control both directions."],
  ["Seated dumbbell calf raise",2,"12–15","Soleus, calves","Use a comfortable range and pause at the top."],
  ["Farmer carry",3,"20–30 m","Grip, trunk, posture","Walk tall with controlled steps."]
 ]},
 {id:"Saturday",kind:"Optional recovery",title:"Easy walk + gentle mobility",duration:"20–40 min",items:[]},
 {id:"Sunday",kind:"Rest",title:"Rest day",duration:"—",items:[]}
];
const WARM=["Easy walk or gentle movement — 4–5 min","Ankle rocks — 10/side","Leg swings — 10 forward/back and 10 side-to-side per leg","Arm circles — 10 each direction","Thoracic rotations — 8/side","For the first compound lift: 1–3 gradually heavier warm-up sets before working sets"];
const MOB=["Half-kneeling hip-flexor stretch — 2 × 20–30 sec/side","Supine hamstring stretch — 2 × 20–30 sec/side","Wall calf stretch — 2 × 20–30 sec/side","Doorway chest stretch — 2 × 20–30 sec","Open-book rotation — 2 × 8/side"];
let state={sessions:[],body:[],conditioning:[],notes:[]};try{const old=JSON.parse(localStorage.getItem(KEY)||"null");if(old&&typeof old==="object")state={...state,...old};}catch(e){}
state.sessions=Array.isArray(state.sessions)?state.sessions:[];state.body=Array.isArray(state.body)?state.body:[];state.conditioning=Array.isArray(state.conditioning)?state.conditioning:[];
let tab="week",selected="Monday",draft={};
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>{let d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){alert("Browser storage is full or unavailable. Export a backup.");}}
function toast(s){let n=$("#toast");if(!n){n=document.createElement("div");n.id="toast";n.style="position:fixed;bottom:85px;left:50%;transform:translateX(-50%);background:#eaf5ef;color:#15251d;padding:10px 15px;border-radius:9px;z-index:9";document.body.append(n);}n.textContent=s;n.hidden=false;setTimeout(()=>n.hidden=true,2200)}
function week(){return `<h1>Your training week</h1><p class="muted">Beginner foundation · 3 strength days · 2 lower-stress athletic days · outdoor cardio</p><section class="card hero"><div class="grid"><div><span class="pill">Primary goal</span><div class="metric">Strength + muscle</div></div><div><span class="pill">Starting block</span><div class="metric">8 weeks</div></div><div><span class="pill">Session target</span><div class="metric">75 min max</div></div></div><p class="small muted">The plan deliberately starts with modest volume. Build consistency and technique before adding sets or intensity.</p></section>${PLAN.map(d=>`<section class="card"><div class="listitem"><div><h3>${d.id} — ${d.title}</h3><span class="pill">${d.kind}</span> <span class="muted small">${d.duration}</span></div><button class="btn secondary small" data-open="${d.id}">Open</button></div>${d.items.length?`<p class="muted small">${d.items.length} exercises · ${d.items.reduce((a,x)=>a+x[1],0)} working sets</p>`:d.id==="Tuesday"?'<p class="muted small">5 min easy walk + 25–35 min brisk walk + mobility + balance</p>':d.id==="Thursday"?'<p class="muted small">15–20 min brisk walk + light athletic circuit + core</p>':'<p class="muted small">Keep recovery easy; no mandatory training.</p>'}</section>`).join("")}<section class="card"><h2>Progression rule</h2><p>For a range such as 8–12 reps, add reps gradually. When every working set reaches the top of the range with good form and the target RIR, increase the load by the smallest practical increment and build reps again.</p><p class="muted small">RIR = repetitions in reserve. Start around 3–4 RIR for the first two weeks; avoid failure training.</p></section>`}
function workout(){const d=PLAN.find(x=>x.id===selected)||PLAN[0];if(!d.items.length)return `<h1>${d.title}</h1><p class="muted">${d.id} · ${d.duration}</p>${d.id==="Tuesday"?`<section class="card"><h2>Outdoor aerobic base</h2><ol><li>Easy walk — 5 min</li><li>Brisk walk — 25–35 min</li><li>Mobility sequence — 8–10 min</li><li>Single-leg balance — 2 × 20–30 sec/side</li></ol><p class="muted">Walk at a pace where you can still speak in sentences.</p></section>`:d.id==="Thursday"?`<section class="card"><h2>Session structure</h2><ol><li>Brisk outdoor walk — 15–20 min</li>${["Bodyweight squat 2 × 10","Reverse lunge 2 × 8/leg","Incline push-up 2 × 8–12","Low-impact lateral shuffle 3 × 15–20 sec","Bird dog 2 × 8/side","Single-leg balance 2 × 20–30 sec/side"].map(x=>`<li>${x}</li>`).join("")}</ol><p class="muted">Keep the session easy to moderate. If still sore from Wednesday, replace leg exercises with gentle mobility.</p></section>`:`<section class="card"><h2>Recovery day</h2><p>Optional easy walk and gentle mobility. Keep it restorative.</p></section>`}<section class="card"><h2>Log this session</h2>${conditionForm(d.id)}</section>`;return `<h1>${d.title}</h1><p class="muted">${d.id} · ${d.duration} · ${d.items.length} exercises</p><section class="card"><h2>Warm-up</h2><ol>${WARM.map(x=>`<li>${x}</li>`).join("")}</ol></section><section class="card"><h2>Working sets</h2><p class="muted small">Enter kg, completed reps and reps in reserve for each set. Warm-up sets are not logged here.</p><div class="field"><label>Session date</label><input id="sessionDate" type="date" value="${today()}"></div>${d.items.map((x,i)=>`<div class="exercise"><h3>${i+1}. ${x[0]}</h3><p>${x[1]} sets · ${x[2]} reps · ${x[3]}</p><p>${x[4]}</p><div class="sethead"><span>Set</span><span>kg</span><span>Reps</span><span>RIR</span></div>${Array.from({length:x[1]},(_,j)=>`<div class="setrow"><span>${j+1}</span><input type="number" min="0" step=".5" placeholder="kg" data-entry="${i}-${j}-w"><input type="number" min="1" step="1" placeholder="reps" data-entry="${i}-${j}-r"><input type="number" min="0" max="10" step="1" placeholder="RIR" value="3" data-entry="${i}-${j}-i"></div>`).join("")}</div>`).join("")}<div class="field"><label>Session notes (optional)</label><textarea id="sessionNotes" rows="2" placeholder="Technique, energy, discomfort..."></textarea></div><button class="btn" data-save-session="${d.id}">Save strength session</button></section><section class="card"><h2>After training: static mobility</h2><ol>${MOB.map(x=>`<li>${x}</li>`).join("")}</ol><p class="muted small">Stretch gently, without pain. These are optional and can be done later in the day.</p></section>`}
function conditionForm(day){return `<div class="field"><label>Date</label><input type="date" id="condDate" value="${today()}"></div><div class="grid"><div class="field"><label>Minutes</label><input type="number" id="condMin" min="0" placeholder="e.g. 30"></div><div class="field"><label>Effort (1–10)</label><input type="number" id="condRpe" min="1" max="10" placeholder="e.g. 4"></div></div><div class="field"><label>Activity / notes</label><input id="condNote" placeholder="Brisk walk, mobility, balance..."></div><button class="btn" data-save-cond="${day}">Save activity</button>`}
function history(){return `<h1>Training history</h1>${state.sessions.length?state.sessions.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(s=>`<section class="card"><div class="listitem"><strong>${esc(s.date)} · ${esc(s.day)}</strong><button class="btn danger small" data-delete-session="${s.id}">Delete</button></div>${Object.entries(s.sets||{}).map(([n,a])=>`<div class="listitem"><span>${esc(n)}</span><span class="muted">${a.map(x=>`${x.w}kg × ${x.r} (RIR ${x.rir})`).join(" · ")}</span></div>`).join("")}${s.notes?`<p class="muted small">${esc(s.notes)}</p>`:""}</section>`).join(""):'<p class="muted">No strength sessions logged yet.</p>'}<h2>Cardio and athletic activity</h2>${state.conditioning.length?state.conditioning.slice().sort((a,b)=>b.date.localeCompare(a.date)).map((x,i)=>`<div class="card"><div class="listitem"><strong>${esc(x.date)} · ${esc(x.day)}</strong><span>${esc(x.minutes)} min · RPE ${esc(x.rpe||"—")}</span></div><p class="muted">${esc(x.note||"Activity")}</p><button class="btn danger small" data-delete-cond="${x.id}">Delete</button></div>`).join(""):'<p class="muted">No activities logged yet.</p>'}`}
function progress(){let total=state.sessions.length,mins=state.conditioning.reduce((a,x)=>a+(+x.minutes||0),0),last7=state.sessions.filter(s=>(Date.now()-new Date(s.date+"T12:00:00").getTime())<7*86400000&&Date.now()>=new Date(s.date+"T12:00:00").getTime()).length;let body=state.body.slice().sort((a,b)=>a.date.localeCompare(b.date));return `<h1>Progress</h1><div class="grid"><section class="card"><div class="muted small">Strength sessions logged</div><div class="metric">${total}</div></section><section class="card"><div class="muted small">Strength sessions · last 7 days</div><div class="metric">${last7}</div></section><section class="card"><div class="muted small">Cardio / activity minutes logged</div><div class="metric">${mins}</div></section></div><section class="card"><h2>Bodyweight trend</h2>${body.filter(x=>x.kg).length?`<p class="metric">${body.filter(x=>x.kg).at(-1).kg} kg</p><p class="muted small">Latest entry · ${esc(body.filter(x=>x.kg).at(-1).date)}</p>`:'<p class="muted">Add measurements in the Body section.</p>'}</section><section class="card"><h2>8-week review</h2><ul><li>Are exercise techniques more consistent?</li><li>Are reps or loads gradually improving?</li><li>Is sleep and recovery adequate?</li><li>Any recurring joint or tendon symptoms?</li><li>Is the schedule sustainable?</li></ul><p class="muted small">Use trends over several weeks. Daily fluctuations are normal.</p></section>`}
function body(){return `<h1>Body & recovery log</h1><section class="card"><h2>Record measurements</h2><div class="field"><label>Date</label><input type="date" id="bodyDate" value="${today()}"></div><div class="grid"><div class="field"><label>Bodyweight (kg)</label><input type="number" id="bodyKg" min="0" step=".1" placeholder="72.0"></div><div class="field"><label>Waist (cm), optional</label><input type="number" id="bodyWaist" min="0" step=".1" placeholder="—"></div></div><button class="btn" data-save-body>Save measurements</button></section><section class="card"><h2>Entries</h2>${state.body.length?state.body.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<div class="listitem"><span>${esc(x.date)}</span><span>${x.kg?esc(x.kg)+" kg":""} ${x.waist?esc(x.waist)+" cm waist":""}</span></div>`).join(""):'<p class="muted">No measurements yet.</p>'}</section><section class="card"><h2>Daily recovery check</h2><p class="muted small">A simple self-check, not a medical assessment.</p><div class="grid">${["Sleep quality","Energy","Muscle soreness","Joint/tendon symptoms"].map((x,i)=>`<div class="field"><label>${x} (1–5)</label><select id="rec${i}"><option value="">Not recorded</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></div>`).join("")}</div><div class="field"><label>Notes</label><input id="recNote" placeholder="Anything affecting today's training?"></div><button class="btn" data-save-recovery>Save recovery check</button><div id="recoveryList"></div></section><section class="card"><h2>Backup and restore</h2><p class="muted small">Data is stored locally in this browser. Export backups regularly. Clearing browser data may erase your log.</p><div class="actions"><button class="btn" data-export>Export JSON backup</button><button class="btn secondary" data-import>Import backup</button><input hidden type="file" id="importFile" accept="application/json"></div></section>`}
function guide(){return `<h1>Training guide</h1><section class="card"><h2>Effort and rest</h2><ul><li>Weeks 1–2: finish most sets with 3–4 reps in reserve (RIR).</li><li>Rest 2–3 minutes after demanding compound lifts; 60–120 seconds after smaller exercises.</li><li>Use controlled repetitions and stop if technique breaks down.</li><li>No 1RM testing and no need to train to failure.</li></ul></section><section class="card"><h2>8-week progression</h2><ol><li><strong>Weeks 1–2:</strong> learn technique, 2 working sets, 3–4 RIR.</li><li><strong>Weeks 3–4:</strong> improve reps; consider a third set on selected main lifts only if recovery is good.</li><li><strong>Weeks 5–6:</strong> gradually add load or selected volume; do not increase everything at once.</li><li><strong>Weeks 7–8:</strong> consolidate, compare logs and decide what to adjust.</li></ol></section><section class="card"><h2>Warm-up and mobility</h2><h3>Before strength training</h3><ol>${WARM.map(x=>`<li>${x}</li>`).join("")}</ol><h3>Static mobility</h3><ol>${MOB.map(x=>`<li>${x}</li>`).join("")}</ol></section><section class="card"><h2>Nutrition basics</h2><ul><li>Starting protein range: approximately 115–140 g/day, based on 72 kg bodyweight.</li><li>Spread protein across 3–5 meals, using foods you enjoy and tolerate.</li><li>Start around maintenance calories; adjust based on bodyweight trend, performance and goal rather than guessing a large surplus or deficit.</li><li>Drink regularly and include fruit, vegetables, fibre-rich carbohydrates and dietary fats.</li><li>Creatine monohydrate 3–5 g/day is an optional, well-studied supplement for healthy adults. Check with a clinician first if you have kidney disease or relevant medical concerns.</li><li>Do not take a routine vitamin stack. Supplement specific nutrients when dietary intake or a confirmed deficiency indicates a need.</li></ul></section><section class="card"><h2>Recovery and pain rules</h2><ul><li>Aim for 7–9 hours of sleep.</li><li>Normal muscle soreness can happen; sharp, worsening or persistent joint/tendon pain is different.</li><li>Reduce or stop a painful movement rather than pushing through it. Persistent pain, swelling or loss of function warrants assessment by a qualified clinician.</li><li>Saturday is optional easy recovery; Sunday is rest.</li></ul></section><section class="card"><h2>Equipment assumptions</h2><p>Program uses your confirmed barbells/racks, dumbbells up to 40 kg, cables, pulldown/row, leg press/curl, chest/shoulder press machines, and flat plus adjustable benches. Cardio is programmed outdoors; no indoor cardio machine is assumed.</p><p class="notice">If a bench, machine or exercise setup is unavailable on a given day, substitute a comfortable equivalent and record the change in session notes.</p></section>`}
function render(){document.querySelectorAll("[data-tab]").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));$("#app").innerHTML=({week,train:workout,history,progress,guide,body})[tab]();}
document.addEventListener("click",e=>{let b=e.target.closest("button");if(!b)return;let d=b.dataset;if(d.tab){tab=d.tab;render();scrollTo(0,0);return}if(d.open){selected=d.open;tab="train";render();scrollTo(0,0);return}if(d.saveSession){let day=d.saveSession,def=PLAN.find(x=>x.id===day),sets={};def.items.forEach((x,i)=>{let a=[];for(let j=0;j<x[1];j++){let get=k=>document.querySelector(`[data-entry="${i}-${j}-${k}"]`)?.value;let w=Number(get("w")),r=Number(get("r")),rir=Number(get("i"));if(get("w")!==""&&get("r")!==""&&w>=0&&r>0)a.push({w,r,rir:Number.isFinite(rir)?rir:3});}if(a.length)sets[x[0]]=a;});if(!Object.keys(sets).length)return toast("Enter weight and reps for at least one set.");state.sessions.push({id:Date.now(),date:$("#sessionDate").value||today(),day,sets,notes:$("#sessionNotes").value});save();toast("Strength session saved.");tab="history";render();return}if(d.saveCond){let minutes=Number($("#condMin").value),rpe=$("#condRpe").value;if(!minutes||minutes<1)return toast("Enter activity duration.");state.conditioning.push({id:Date.now(),date:$("#condDate").value||today(),day:d.saveCond,minutes,rpe,note:$("#condNote").value});save();toast("Activity saved.");tab="history";render();return}if(d.saveBody!==undefined){let kg=$("#bodyKg").value,waist=$("#bodyWaist").value;if(!kg&&!waist)return toast("Enter at least one measurement.");let date=$("#bodyDate").value||today();state.body=state.body.filter(x=>x.date!==date);state.body.push({date,kg:kg?Number(kg):null,waist:waist?Number(waist):null});save();toast("Measurements saved.");render();return}if(d.saveRecovery!==undefined){let vals=[0,1,2,3].map(i=>$("#rec"+i).value);let note=$("#recNote").value;state.notes.push({date:today(),vals,note});save();toast("Recovery check saved.");render();return}if(d.deleteSession){if(confirm("Delete this session?")){state.sessions=state.sessions.filter(x=>String(x.id)!==d.deleteSession);save();render();}return}if(d.deleteCond){state.conditioning=state.conditioning.filter(x=>String(x.id)!==d.deleteCond);save();render();return}if(d.export){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:"application/json"}));a.download="lift-log-backup-"+today()+".json";a.click();URL.revokeObjectURL(a.href);return}if(d.import){$("#importFile").click();return}});
document.addEventListener("change",e=>{if(e.target.id==="importFile"&&e.target.files[0]){let fr=new FileReader();fr.onload=()=>{try{let o=JSON.parse(fr.result);if(!Array.isArray(o.sessions)||!Array.isArray(o.body))throw Error();if(!confirm("Replace current Lift Log data with this backup?"))return;state={...state,...o};save();render();toast("Backup restored.");}catch(_){toast("Invalid Lift Log backup file.");}};fr.readAsText(e.target.files[0]);}});
render();
</script>
</body>
</html>
